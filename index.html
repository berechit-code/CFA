<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CFA® L1 2027 QBank, Cloud Sync & Streak Calendar — Carmen Guintrand</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- MathJax for LaTeX Formula Rendering ($...$ and $$...$$) -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['[', ']']]
      },
      svg: { fontCache: 'global' }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .option-card { transition: all 0.14s ease; }
    .option-card:hover:not(.disabled) { border-color: #2563eb; background-color: #eff6ff; }
    .option-selected { border-color: #1d4ed8 !important; background-color: #dbeafe !important; }
    .option-correct { border-color: #059669 !important; background-color: #d1fae5 !important; }
    .option-wrong { border-color: #dc2626 !important; background-color: #fee2e2 !important; }
    .cal-day { transition: transform 0.12s ease, box-shadow 0.12s ease; }
    .cal-day:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(15,23,42,0.12); }
    .whitespace-pre-wrap-math { white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- TOP NAVIGATION BAR -->
  <header class="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-30 shadow-md">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 py-2.5 flex flex-wrap items-center justify-between gap-2">
      <!-- Brand & Countdown -->
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-lg bg-blue-600 flex items-center justify-center font-extrabold text-xs tracking-wider shadow-inner">CFA</div>
        <div>
          <div class="flex flex-wrap items-center gap-1.5">
            <h1 class="font-bold text-xs sm:text-sm tracking-tight">CFA® L1 2027 Simulator</h1>
            <span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 border border-amber-500/30">Carmen Guintrand</span>
            <button onclick="openCloudModal()" id="cloudStatusBadge" class="text-[10px] font-mono px-2 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700 transition flex items-center gap-1">
              <span id="cloudDot" class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>
              <span id="cloudStatusText">Local Only (Tap to Sync)</span>
            </button>
          </div>
          <p class="text-[11px] text-slate-400">
            Exam: <span class="text-white font-semibold">25 Feb 2027</span> · 
            <span id="daysRemainingHeader" class="text-amber-400 font-semibold">-- days left</span>
          </p>
        </div>
      </div>

      <!-- Daily Goal & Streak Widget -->
      <div class="flex items-center gap-2 bg-slate-800/90 border border-slate-700 rounded-xl px-2.5 py-1.5">
        <div>
          <div class="flex items-center justify-between gap-2 text-[10px] uppercase tracking-wider font-bold text-slate-400">
            <span>🔥 Daily Goal</span>
            <span id="streakBadge" class="text-amber-400">1D Streak</span>
          </div>
          <div class="flex items-center gap-2 mt-0.5">
            <span id="dailyCountText" class="mono text-xs font-extrabold text-white">0 / 20</span>
            <div class="w-16 sm:w-20 h-2 bg-slate-950 rounded-full overflow-hidden">
              <div id="dailyProgressBar" class="h-full bg-emerald-500 transition-all duration-300" style="width: 0%"></div>
            </div>
            <select id="dailyTargetSelect" onchange="updateDailyTarget(this.value)" class="bg-slate-900 text-[11px] text-slate-200 border border-slate-700 rounded px-1 py-0.5">
              <option value="10">10/d</option>
              <option value="15">15/d</option>
              <option value="20" selected>20/d</option>
              <option value="25">25/d</option>
              <option value="30">30/d</option>
              <option value="50">50/d</option>
            </select>
          </div>
        </div>
        <button onclick="startDailyBatch(true)" class="px-2.5 py-1.5 rounded-lg bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs transition shadow-sm whitespace-nowrap" title="Generate or resume today's weighted drill">
          ▶ Daily Drill
        </button>
      </div>

      <!-- View Tabs -->
      <div class="flex items-center gap-1 overflow-x-auto max-w-full py-0.5">
        <button onclick="switchTab('drill')" id="tab-drill" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-blue-600 text-white transition whitespace-nowrap">⚡ QCM Drill</button>
        <button onclick="switchTab('calendar')" id="tab-calendar" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition whitespace-nowrap">📅 Calendar & Analytics</button>
        <button onclick="switchTab('les')" id="tab-les" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition whitespace-nowrap">📚 LES (2,115)</button>
        <button onclick="openQBankModal()" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-emerald-700 text-white hover:bg-emerald-600 transition whitespace-nowrap">+ Add Qs</button>
        <button onclick="openCloudModal()" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white hover:bg-indigo-500 transition whitespace-nowrap">☁️ Sync</button>
      </div>
    </div>
  </header>

  <!-- SUB-TOOLBAR -->
  <div id="quizToolbar" class="bg-white border-b border-slate-200 shadow-sm">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 py-2 flex flex-wrap items-center justify-between gap-2">
      <div class="flex flex-wrap items-center gap-2">
        <select id="topicSelect" onchange="filterByTopic(this.value)" class="text-xs font-semibold bg-slate-50 border border-slate-300 rounded-lg px-2.5 py-1.5 text-slate-800 focus:outline-none focus:border-blue-600">
          <option value="DAILY">🎯 Smart Daily Drill (Exam-Weighted + Errors & Least Seen)</option>
          <option value="ALL">All
